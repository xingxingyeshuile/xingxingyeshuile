            // ──────────────────────────────────────
            // JSON导入
            // ──────────────────────────────────────
            function importJSON(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        let importedCount = 0;
                        let migratedCount = 0;
                        let comicsToImport = [];
                        if (Array.isArray(data.comics)) {
                            comicsToImport = data.comics;
                        } else if (typeof data.comicName === 'string' || typeof data.totalIssues === 'number') {
                            comicsToImport = [data];
                        } else {
                            showToast('JSON格式无法识别，请检查文件格式');
                            return;
                        }
                        comicsToImport.forEach(c => {
                            if (!c || typeof c.comicName !== 'string') return;
                            let issueGroups = {};
                            let wasMigrated = false;
                            if (c.issueGroups && typeof c.issueGroups === 'object') {
                                for (const [key, value] of Object.entries(c.issueGroups)) {
                                    issueGroups[key] = String(value);
                                }
                            } else if (Array.isArray(c.chineseAvailable)) {
                                c.chineseAvailable.forEach(n => {
                                    if (typeof n === 'number' && Number.isFinite(n) && Number.isInteger(n)) {
                                        issueGroups[String(n)] = '旧数据';
                                    }
                                });
                                wasMigrated = true;
                                migratedCount++;
                            }
                            const comicData = {
                                id: (typeof c.id === 'string' && c.id) ? c.id : generateId(),
                                comicName: c.comicName || '未命名作品',
                                volume: typeof c.volume === 'string' ? c.volume : '',
                                year: typeof c.year === 'string' ? c.year : '',
                                team: typeof c.team === 'string' ? c.team : '',
                                startIssue: (typeof c.startIssue === 'number' && Number.isFinite(c.startIssue)) ?
                                    c.startIssue : 1,
                                totalIssues: (typeof c.totalIssues === 'number' && Number.isFinite(c.totalIssues) &&
                                    c.totalIssues >= 1) ? Math.min(c.totalIssues, 3000) : 50,
                                annuals: (Array.isArray(c.annuals)) ? [...c.annuals].filter(n => Number.isFinite(n) &&
                                    n > 0).sort((a, b) => a - b) : [],
                                specials: (Array.isArray(c.specials)) ? [...c.specials].filter(n => Number.isFinite(
                                    n) && n > 0).sort((a, b) => a - b) : [],
                                issueGroups: issueGroups
                            };
                            const allValidKeys = new Set();
                            for (let i = 0; i < comicData.totalIssues; i++) {
                                allValidKeys.add(mainIssueKey(comicData.startIssue + i));
                            }
                            comicData.annuals.forEach(n => allValidKeys.add(annualIssueKey(n)));
                            comicData.specials.forEach(n => allValidKeys.add(specialIssueKey(n)));
                            for (const key of Object.keys(comicData.issueGroups)) {
                                if (!allValidKeys.has(key)) delete comicData.issueGroups[key];
                            }
                            const existingIndex = state.order.indexOf(comicData.id);
                            if (existingIndex >= 0 && state.comics[comicData.id]) {
                                state.comics[comicData.id] = comicData;
                            } else {
                                state.comics[comicData.id] = comicData;
                                if (!state.order.includes(comicData.id)) state.order.push(comicData.id);
                            }
                            importedCount++;
                        });
                        if (importedCount === 0) { showToast('未找到可导入的作品数据'); return; }
                        const firstImportedId = comicsToImport[0]?.id;
                        if (firstImportedId && state.comics[firstImportedId]) {
                            state.activeComicId = firstImportedId;
                        } else if (state.order.length > 0) {
                            state.activeComicId = state.order[0];
                        }
                        syncSettingsToPanel();
                        currentFilter = 'all';
                        filterBtns.forEach(b => b.classList.remove('active'));
                        const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                        if (allBtn) allBtn.classList.add('active');
                        groupFilterSelect.value = '__all__';
                        groupFilterSelect.classList.remove('has-selection');
                        exitMultiSelectMode(false);
                        renderGrid();
                        updateStats();
                        saveState();
                        rebuildSelector();
                        gridContainer.scrollTop = 0;
                        let msg = `导入成功！共导入 ${importedCount} 部作品`;
                        if (migratedCount > 0) msg += `（其中 ${migratedCount} 部从旧格式自动迁移）`;
                        showToast(msg);
                    } catch (err) {
                        showToast('JSON解析失败，请检查文件格式');
                        console.error('导入JSON错误:', err);
                    }
                };
                reader.onerror = function() { showToast('文件读取失败，请重试'); };
                reader.readAsText(file);
            }

            // ──────────────────────────────────────
            // 跳转功能（支持主刊/年刊/特刊）
            // ──────────────────────────────────────
            function jumpToIssue() {
                if (!gridGenerated) { showToast('请先生成网格'); return; }
                const targetIssue = parseInt(jumpInput.value, 10);
                if (!Number.isFinite(targetIssue)) { showToast('请输入有效的期号'); return; }
                const comic = getActiveComic();
                if (!comic) return;
                const jumpType = jumpTypeSelect.value;
                let issueKey;
                let rangeLabel = '';

                if (jumpType === 'main') {
                    const minIssue = comic.startIssue;
                    const maxIssue = comic.startIssue + comic.totalIssues - 1;
                    if (targetIssue < minIssue || targetIssue > maxIssue) {
                        showToast(`期号 ${targetIssue} 不在主刊范围内（#${minIssue} - #${maxIssue}）`);
                        return;
                    }
                    issueKey = mainIssueKey(targetIssue);
                    rangeLabel = `主刊 #${targetIssue}`;
                } else if (jumpType === 'annual') {
                    const annuals = comic.annuals || [];
                    if (annuals.length === 0) { showToast('当前作品没有年刊'); return; }
                    if (!annuals.includes(targetIssue)) {
                        showToast(
                            `年刊 #${targetIssue} 不存在，可用的年刊期号：${annuals.join(', ')}`);
                        return;
                    }
                    issueKey = annualIssueKey(targetIssue);
                    rangeLabel = `年刊 #${targetIssue}`;
                } else if (jumpType === 'special') {
                    const specials = comic.specials || [];
                    if (specials.length === 0) { showToast('当前作品没有特刊'); return; }
                    if (!specials.includes(targetIssue)) {
                        showToast(
                            `特刊 #${targetIssue} 不存在，可用的特刊期号：${specials.join(', ')}`);
                        return;
                    }
                    issueKey = specialIssueKey(targetIssue);
                    rangeLabel = `特刊 #${targetIssue}`;
                } else {
                    showToast('请选择跳转类型');
                    return;
                }

                const cell = issuesGrid.querySelector(`.issue-cell[data-issue-key="${CSS.escape(issueKey)}"]`);
                if (cell) {
                    if (cell.style.display === 'none') {
                        currentFilter = 'all';
                        filterBtns.forEach(b => b.classList.remove('active'));
                        const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                        if (allBtn) allBtn.classList.add('active');
                        groupFilterSelect.value = '__all__';
                        groupFilterSelect.classList.remove('has-selection');
                        applyFilterToCells();
                    }
                    cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    cell.classList.remove('flash-highlight');
                    void cell.offsetWidth;
                    cell.classList.add('flash-highlight');
                    cell.addEventListener('animationend', function handler() {
                        cell.classList.remove('flash-highlight');
                        cell.removeEventListener('animationend', handler);
                    }, { once: true });
                    cell.focus({ preventScroll: true });
                    showToast(`已定位到 ${rangeLabel}`);
                }
            }

            // ──────────────────────────────────────
            // 事件绑定
            // ──────────────────────────────────────
            btnApply.addEventListener('click', generateGrid);

            [comicNameInput, volumeInput, yearInput, startIssueInput, totalIssuesInput, annualsInput, specialsInput]
            .forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault();
                        generateGrid(); }
                });
            });

            // 年刊/特刊一键生成按钮
            btnGenAnnuals.addEventListener('click', handleGenAnnuals);
            btnGenSpecials.addEventListener('click', handleGenSpecials);

            // 生成器输入框也支持回车
            [annualGenStart, annualGenCount].forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault();
                        handleGenAnnuals(); }
                });
            });
            [specialGenStart, specialGenCount].forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault();
                        handleGenSpecials(); }
                });
            });

            comicSelector.addEventListener('change', () => {
                const selectedId = comicSelector.value;
                if (selectedId && state.comics[selectedId]) switchToComic(selectedId);
            });

            btnAddComic.addEventListener('click', addNewComic);
            btnDeleteComic.addEventListener('click', deleteCurrentComic);

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    groupFilterSelect.value = '__all__';
                    groupFilterSelect.classList.remove('has-selection');
                    if (gridGenerated) applyFilterToCells();
                });
            });

            groupFilterSelect.addEventListener('change', () => {
                if (groupFilterSelect.value !== '__all__') {
                    groupFilterSelect.classList.add('has-selection');
                    filterBtns.forEach(b => b.classList.remove('active'));
                    currentFilter = 'all';
                } else {
                    groupFilterSelect.classList.remove('has-selection');
                    filterBtns.forEach(b => b.classList.remove('active'));
                    const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                    if (allBtn) allBtn.classList.add('active');
                    currentFilter = 'all';
                }
                if (gridGenerated) applyFilterToCells();
            });

            btnMultiSelectToggle.addEventListener('click', toggleMultiSelectMode);
            btnSelectAllInMulti.addEventListener('click', selectAllVisibleIssues);
            btnMarkSelected.addEventListener('click', markSelectedIssues);
            btnUnmarkSelected.addEventListener('click', unmarkSelectedIssues);
            btnExitMultiSelect.addEventListener('click', () => {
                exitMultiSelectMode();
                showToast('已退出多选模式');
            });

            btnMarkAll.addEventListener('click', markAll);
            btnUnmarkAll.addEventListener('click', unmarkAll);
            btnInvert.addEventListener('click', invertMarks);

            btnImport.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    importJSON(e.target.files[0]);
                    fileInput.value = '';
                }
            });
            btnExport.addEventListener('click', exportCurrentData);
            btnExportExample.addEventListener('click', exportExample);

            btnJump.addEventListener('click', jumpToIssue);
            jumpInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault();
                    jumpToIssue(); }
            });
            jumpTypeSelect.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault();
                    jumpInput.focus();
                    jumpInput.select(); }
            });

            // Modal事件
            btnModalConfirm.addEventListener('click', confirmModal);
            btnModalCancel.addEventListener('click', closeModal);
            btnModalClear.addEventListener('click', clearModalIssue);

            // 点击遮罩关闭modal
            groupModalOverlay.addEventListener('click', (e) => {
                if (e.target === groupModalOverlay) closeModal();
            });

            // Modal键盘操作
            modalGroupInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    confirmModal();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeModal();
                }
            });

            // 全局键盘快捷键
            document.addEventListener('keydown', (e) => {
                // 如果modal打开，优先让modal处理
                if (groupModalOverlay.classList.contains('active')) return;

                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    if (state.order.length > 0) exportCurrentData();
                    else showToast('暂无数据可导出');
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'S') {
                    e.preventDefault();
                    exportExample();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'a' && document.activeElement && document.activeElement
                    .closest('#gridContainer')) {
                    e.preventDefault();
                    markAll();
                }
                if (e.key === 'Escape' && multiSelectMode) {
                    e.preventDefault();
                    exitMultiSelectMode();
                    showToast('已退出多选模式');
                }
            });

            // ──────────────────────────────────────
            // 输入框变更时自动保存设置
            // ──────────────────────────────────────
            let autoSaveTimeout;
            [comicNameInput, volumeInput, yearInput, startIssueInput, totalIssuesInput, annualsInput, specialsInput]
            .forEach(input => {
                input.addEventListener('input', () => {
                    clearTimeout(autoSaveTimeout);
                    autoSaveTimeout = setTimeout(() => {
                        const comic = getActiveComic();
                        if (!comic) return;
                        const comicName = comicNameInput.value.trim();
                        const volume = volumeInput.value.trim();
                        const year = yearInput.value.trim();
                        const startIssue = parseInt(startIssueInput.value, 10);
                        const totalIssues = parseInt(totalIssuesInput.value, 10);
                        const annuals = parseIssueList(annualsInput.value);
                        const specials = parseIssueList(specialsInput.value);
                        if (comicName !== undefined) comic.comicName = comicName;
                        if (volume !== undefined) comic.volume = volume;
                        if (year !== undefined) comic.year = year;
                        if (Number.isFinite(startIssue)) comic.startIssue = startIssue;
                        if (Number.isFinite(totalIssues) && totalIssues >= 1) comic.totalIssues = Math.min(
                            totalIssues, 3000);
                        comic.annuals = annuals;
                        comic.specials = specials;
                        saveState();
                        rebuildSelector();
                    }, 600);
                });
            });

            // ──────────────────────────────────────
            // 拖拽导入JSON
            // ──────────────────────────────────────
            document.addEventListener('dragover', (e) => { e.preventDefault(); });
            document.addEventListener('drop', (e) => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file && file.name.toLowerCase().endsWith('.json')) importJSON(file);
                else if (file) showToast('请拖入 .json 文件');
            });

            gridContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                gridContainer.style.borderColor = '#4da674';
                gridContainer.style.boxShadow = '0 0 0 4px rgba(77,166,116,0.15)';
            });
            gridContainer.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                gridContainer.style.borderColor = '';
                gridContainer.style.boxShadow = '';
            });
            gridContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                gridContainer.style.borderColor = '';
                gridContainer.style.boxShadow = '';
                const file = e.dataTransfer.files[0];
                if (file && file.name.toLowerCase().endsWith('.json')) importJSON(file);
                else if (file) showToast('请拖入 .json 文件');
            });

            // ──────────────────────────────────────
            // 初始化
            // ──────────────────────────────────────
            function init() {
                loadState();
                rebuildSelector();
                syncSettingsToPanel();

                if (state.activeComicId && state.comics[state.activeComicId]) {
                    const comic = getActiveComic();
                    if (comic && (comic.totalIssues > 0 || (comic.annuals || []).length > 0 || (comic.specials || [])
                            .length > 0)) {
                        const removed = cleanInvalidMarks();
                        renderGrid();
                        updateStats();
                        updateGroupFilterSelect();
                        if (removed > 0) showToast(`已自动恢复数据，清理了 ${removed} 个无效标记`);
                        saveState();
                    } else if (comic) {
                        renderGrid();
                        updateStats();
                        updateGroupFilterSelect();
                    }
                } else {
                    issuesGrid.style.display = 'none';
                    emptyState.style.display = '';
                    statsBar.style.opacity = '0.4';
                    updateStats();
                    updateGroupFilterSelect();
                }
            }

            init();

            // ──────────────────────────────────────
            // 暴露API到全局（调试用）
            // ──────────────────────────────────────
            window.__comicTracker = {
                state,
                generateGrid,
                renderGrid,
                exportCurrentData,
                exportExample,
                importJSON,
                markAll,
                unmarkAll,
                invertMarks,
                addNewComic,
                deleteCurrentComic,
                switchToComic,
                enterMultiSelectMode,
                exitMultiSelectMode,
                toggleMultiSelectMode,
                openModal,
                closeModal,
                getState: () => state,
                resetAll: () => {
                    state.comics = {};
                    state.order = [];
                    state.activeComicId = null;
                    currentFilter = 'all';
                    gridGenerated = false;
                    multiSelectMode = false;
                    selectedIssueSet.clear();
                    modalContext = null;
                    comicNameInput.value = '';
                    volumeInput.value = '';
                    yearInput.value = '';
                    startIssueInput.value = '1';
                    totalIssuesInput.value = '50';
                    annualsInput.value = '';
                    specialsInput.value = '';
                    annualGenStart.value = '1';
                    annualGenCount.value = '1';
                    specialGenStart.value = '1';
                    specialGenCount.value = '1';
                    issuesGrid.innerHTML = '';
                    issuesGrid.style.display = 'none';
                    emptyState.style.display = '';
                    filterBtns.forEach(b => b.classList.remove('active'));
                    const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                    if (allBtn) allBtn.classList.add('active');
                    groupFilterSelect.value = '__all__';
                    groupFilterSelect.classList.remove('has-selection');
                    groupFilterSelect.innerHTML = '<option value="__all__">全部汉化组</option>';
                    btnMultiSelectToggle.classList.remove('active');
                    multiSelectBar.classList.remove('visible');
                    selectedCount.textContent = '已选 0 期';
                    statAnnuals.style.display = 'none';
                    statSpecials.style.display = 'none';
                    groupModalOverlay.classList.remove('active');
                    document.body.classList.remove('modal-open');
                    modalGroupInput.value = '';
                    modalGroupDatalist.innerHTML = '';
                    modalExistingGroups.innerHTML = '';
                    jumpTypeSelect.innerHTML =
                        '<option value="main">主刊</option><option value="annual">年刊</option><option value="special">特刊</option>';
                    jumpTypeSelect.value = 'main';
                    jumpInput.value = '';
                    rebuildSelector();
                    updateStats();
                    statsBar.style.opacity = '0.4';
                    saveState();
                    localStorage.removeItem(OLD_STORAGE_KEY_V4);
                    localStorage.removeItem(OLD_STORAGE_KEY_V3);
                    localStorage.removeItem(OLD_STORAGE_KEY_V2);
                    localStorage.removeItem(OLD_STORAGE_KEY_V1);
                    showToast('已重置全部数据');
                }
            };

            console.log(
                '%c📚 美漫汉化追踪器 v5（年刊·特刊·多选·汉化组可选弹窗·一键生成·智能跳转）已就绪 %c| %c点击网格编辑 %c| %c长按或点击"多选"批量操作',
                'color:#5fc286;font-weight:bold;', '', 'color:#d0d0dc;', '', 'color:#9898ae;');
            console.log('%c💡 提示：Ctrl+S 导出 | Esc 退出多选/关闭弹窗 | 拖拽JSON导入 | 年刊/特刊支持一键生成',
                'color:#9898ae;font-size:0.85em;');
        })();
    </script>
</body>
</html>
