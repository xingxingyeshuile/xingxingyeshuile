    <script>
        (function() {
            // ──────────────────────────────────────
            // DOM引用
            // ──────────────────────────────────────
            const comicSelector = document.getElementById('comicSelector');
            const btnAddComic = document.getElementById('btnAddComic');
            const btnDeleteComic = document.getElementById('btnDeleteComic');
            const comicNameInput = document.getElementById('comicName');
            const volumeInput = document.getElementById('volume');
            const yearInput = document.getElementById('year');
            const startIssueInput = document.getElementById('startIssue');
            const totalIssuesInput = document.getElementById('totalIssues');
            const annualsInput = document.getElementById('annualsInput');
            const specialsInput = document.getElementById('specialsInput');
            const annualGenStart = document.getElementById('annualGenStart');
            const annualGenCount = document.getElementById('annualGenCount');
            const btnGenAnnuals = document.getElementById('btnGenAnnuals');
            const specialGenStart = document.getElementById('specialGenStart');
            const specialGenCount = document.getElementById('specialGenCount');
            const btnGenSpecials = document.getElementById('btnGenSpecials');
            const btnApply = document.getElementById('btnApply');
            const issuesGrid = document.getElementById('issuesGrid');
            const emptyState = document.getElementById('emptyState');
            const gridContainer = document.getElementById('gridContainer');
            const statsBar = document.getElementById('statsBar');
            const statTotal = document.getElementById('statTotal');
            const statMarked = document.getElementById('statMarked');
            const statUnmarked = document.getElementById('statUnmarked');
            const statPercent = document.getElementById('statPercent');
            const progressFill = document.getElementById('progressFill');
            const statAnnuals = document.getElementById('statAnnuals');
            const statAnnualCount = document.getElementById('statAnnualCount');
            const statAnnualMarked = document.getElementById('statAnnualMarked');
            const statSpecials = document.getElementById('statSpecials');
            const statSpecialCount = document.getElementById('statSpecialCount');
            const statSpecialMarked = document.getElementById('statSpecialMarked');
            const toast = document.getElementById('toast');
            const fileInput = document.getElementById('fileInput');
            const jumpInput = document.getElementById('jumpInput');
            const jumpTypeSelect = document.getElementById('jumpTypeSelect');
            const btnJump = document.getElementById('btnJump');
            const btnMarkAll = document.getElementById('btnMarkAll');
            const btnUnmarkAll = document.getElementById('btnUnmarkAll');
            const btnInvert = document.getElementById('btnInvert');
            const btnImport = document.getElementById('btnImport');
            const btnExport = document.getElementById('btnExport');
            const btnExportExample = document.getElementById('btnExportExample');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const groupFilterSelect = document.getElementById('groupFilterSelect');
            const btnMultiSelectToggle = document.getElementById('btnMultiSelectToggle');
            const multiSelectBar = document.getElementById('multiSelectBar');
            const selectedCount = document.getElementById('selectedCount');
            const btnSelectAllInMulti = document.getElementById('btnSelectAllInMulti');
            const btnMarkSelected = document.getElementById('btnMarkSelected');
            const btnUnmarkSelected = document.getElementById('btnUnmarkSelected');
            const btnExitMultiSelect = document.getElementById('btnExitMultiSelect');

            // Modal DOM
            const groupModalOverlay = document.getElementById('groupModalOverlay');
            const modalTitleText = document.getElementById('modalTitleText');
            const modalIssueBadge = document.getElementById('modalIssueBadge');
            const modalGroupInput = document.getElementById('modalGroupInput');
            const modalGroupDatalist = document.getElementById('modalGroupDatalist');
            const modalExistingGroups = document.getElementById('modalExistingGroups');
            const btnModalClear = document.getElementById('btnModalClear');
            const btnModalCancel = document.getElementById('btnModalCancel');
            const btnModalConfirm = document.getElementById('btnModalConfirm');

            // ──────────────────────────────────────
            // 状态
            // ──────────────────────────────────────
            const STORAGE_KEY = 'comic-tracker-multi-v5';
            const OLD_STORAGE_KEY_V4 = 'comic-tracker-multi-v4';
            const OLD_STORAGE_KEY_V3 = 'comic-tracker-multi-v3';
            const OLD_STORAGE_KEY_V2 = 'comic-tracker-multi-v2';
            const OLD_STORAGE_KEY_V1 = 'comic-tracker-state-v2';

            // 生成唯一ID
            function generateId() {
                return 'c' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 8);
            }

            // 创建默认作品数据
            function createDefaultComic(name) {
                return {
                    id: generateId(),
                    comicName: name || '',
                    volume: '',
                    year: '',
                    team: '',
                    startIssue: 1,
                    totalIssues: 50,
                    annuals: [],
                    specials: [],
                    issueGroups: {}
                };
            }

            // 全局状态
            let state = {
                comics: {},
                order: [],
                activeComicId: null
            };
            let currentFilter = 'all';
            let gridGenerated = false;
            let toastTimer = null;

            // 多选模式状态
            let multiSelectMode = false;
            let selectedIssueSet = new Set();

            // Modal上下文
            let modalContext = null; // { mode: 'single'|'multi', issueKey?: string, cellElement?: Element }

            // ──────────────────────────────────────
            // 辅助：issueKey相关
            // ──────────────────────────────────────
            function mainIssueKey(num) { return String(num); }

            function annualIssueKey(num) { return 'annual_' + num; }

            function specialIssueKey(num) { return 'special_' + num; }

            function getIssueType(issueKey) {
                if (typeof issueKey === 'string' && issueKey.startsWith('annual_')) return 'annual';
                if (typeof issueKey === 'string' && issueKey.startsWith('special_')) return 'special';
                return 'main';
            }

            function getIssueNumberFromKey(issueKey) {
                const type = getIssueType(issueKey);
                if (type === 'annual') return parseInt(issueKey.replace('annual_', ''), 10);
                if (type === 'special') return parseInt(issueKey.replace('special_', ''), 10);
                return parseInt(issueKey, 10);
            }

            function getIssueDisplayName(issueKey) {
                const type = getIssueType(issueKey);
                const num = getIssueNumberFromKey(issueKey);
                if (type === 'annual') return '年刊 #' + num;
                if (type === 'special') return '特刊 #' + num;
                return '第 ' + num + ' 期';
            }

            function getIssueTypeBadge(issueKey) {
                const type = getIssueType(issueKey);
                if (type === 'annual') return '年刊';
                if (type === 'special') return '特刊';
                return '';
            }

            // ──────────────────────────────────────
            // 辅助：解析逗号分隔的期号列表
            // ──────────────────────────────────────
            function parseIssueList(input) {
                if (!input || !input.trim()) return [];
                const result = [];
                const parts = input.split(',');
                for (const part of parts) {
                    const trimmed = part.trim();
                    if (trimmed === '') continue;
                    const num = parseInt(trimmed, 10);
                    if (Number.isFinite(num) && num > 0 && !result.includes(num)) {
                        result.push(num);
                    }
                }
                result.sort((a, b) => a - b);
                return result;
            }

            function formatIssueList(arr) {
                if (!arr || arr.length === 0) return '';
                return arr.join(', ');
            }

            // ──────────────────────────────────────
            // 辅助：年刊/特刊一键生成
            // ──────────────────────────────────────
            function generateIssueListFromRange(startNum, count) {
                const result = [];
                for (let i = 0; i < count; i++) {
                    result.push(startNum + i);
                }
                return result;
            }

            function handleGenAnnuals() {
                const start = parseInt(annualGenStart.value, 10);
                const count = parseInt(annualGenCount.value, 10);
                if (!Number.isFinite(start) || start < 1) {
                    showToast('年刊起始期号需为正整数');
                    return;
                }
                if (!Number.isFinite(count) || count < 1 || count > 500) {
                    showToast('年刊数量需在1~500之间');
                    return;
                }
                const list = generateIssueListFromRange(start, count);
                annualsInput.value = list.join(', ');
                annualsInput.dispatchEvent(new Event('input', { bubbles: true }));
                showToast(`已生成 ${count} 期年刊（#${start} - #${start + count - 1}）`);
            }

            function handleGenSpecials() {
                const start = parseInt(specialGenStart.value, 10);
                const count = parseInt(specialGenCount.value, 10);
                if (!Number.isFinite(start) || start < 1) {
                    showToast('特刊起始期号需为正整数');
                    return;
                }
                if (!Number.isFinite(count) || count < 1 || count > 500) {
                    showToast('特刊数量需在1~500之间');
                    return;
                }
                const list = generateIssueListFromRange(start, count);
                specialsInput.value = list.join(', ');
                specialsInput.dispatchEvent(new Event('input', { bubbles: true }));
                showToast(`已生成 ${count} 期特刊（#${start} - #${start + count - 1}）`);
            }

            // ──────────────────────────────────────
            // 辅助：获取当前活跃作品
            // ──────────────────────────────────────
            function getActiveComic() {
                if (state.activeComicId && state.comics[state.activeComicId]) {
                    return state.comics[state.activeComicId];
                }
                return null;
            }

            function getActiveIssueGroups() {
                const comic = getActiveComic();
                if (!comic) return {};
                if (!comic.issueGroups || typeof comic.issueGroups !== 'object') {
                    comic.issueGroups = {};
                }
                return comic.issueGroups;
            }

            function isIssueMarkedByKey(issueKey) {
                const groups = getActiveIssueGroups();
                return groups.hasOwnProperty(String(issueKey));
            }

            function getIssueGroupNameByKey(issueKey) {
                const groups = getActiveIssueGroups();
                const key = String(issueKey);
                if (groups.hasOwnProperty(key)) {
                    return String(groups[key] || '');
                }
                return null;
            }

            function setIssueGroupByKey(issueKey, groupName) {
                const comic = getActiveComic();
                if (!comic) return;
                if (!comic.issueGroups || typeof comic.issueGroups !== 'object') {
                    comic.issueGroups = {};
                }
                const key = String(issueKey);
                if (groupName === null || groupName === undefined) {
                    delete comic.issueGroups[key];
                } else {
                    comic.issueGroups[key] = String(groupName);
                }
            }

            function removeIssueGroupByKey(issueKey) {
                const comic = getActiveComic();
                if (!comic) return;
                if (!comic.issueGroups || typeof comic.issueGroups !== 'object') {
                    comic.issueGroups = {};
                }
                delete comic.issueGroups[String(issueKey)];
            }

            function getAllIssueKeys() {
                const comic = getActiveComic();
                if (!comic) return [];
                const keys = [];
                for (let i = 0; i < comic.totalIssues; i++) {
                    keys.push(mainIssueKey(comic.startIssue + i));
                }
                const annuals = comic.annuals || [];
                for (const num of annuals) {
                    keys.push(annualIssueKey(num));
                }
                const specials = comic.specials || [];
                for (const num of specials) {
                    keys.push(specialIssueKey(num));
                }
                return keys;
            }

            function isValidIssueKey(issueKey) {
                const comic = getActiveComic();
                if (!comic) return false;
                const type = getIssueType(issueKey);
                const num = getIssueNumberFromKey(issueKey);
                if (!Number.isFinite(num)) return false;
                if (type === 'main') {
                    const minIssue = comic.startIssue;
                    const maxIssue = comic.startIssue + comic.totalIssues - 1;
                    return num >= minIssue && num <= maxIssue;
                }
                if (type === 'annual') {
                    return (comic.annuals || []).includes(num);
                }
                if (type === 'special') {
                    return (comic.specials || []).includes(num);
                }
                return false;
            }

            // ──────────────────────────────────────
            // Toast
            // ──────────────────────────────────────
            function showToast(message) {
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2000);
            }

            // ──────────────────────────────────────
            // 持久化
            // ──────────────────────────────────────
            function saveState() {
                try {
                    const comicsArray = state.order.map(id => {
                        const c = state.comics[id];
                        if (!c) return null;
                        const cleanIssueGroups = {};
                        if (c.issueGroups && typeof c.issueGroups === 'object') {
                            for (const [key, value] of Object.entries(c.issueGroups)) {
                                cleanIssueGroups[key] = String(value);
                            }
                        }
                        return {
                            id: c.id,
                            comicName: c.comicName,
                            volume: c.volume,
                            year: c.year,
                            team: c.team || '',
                            startIssue: c.startIssue,
                            totalIssues: c.totalIssues,
                            annuals: (c.annuals && Array.isArray(c.annuals)) ? [...c.annuals].sort((a, b) => a - b) : [],
                            specials: (c.specials && Array.isArray(c.specials)) ? [...c.specials].sort((a, b) => a -
                                b) : [],
                            issueGroups: cleanIssueGroups
                        };
                    }).filter(Boolean);
                    const data = {
                        comics: comicsArray,
                        activeComicId: state.activeComicId
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {}
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        state.comics = {};
                        state.order = [];
                        if (Array.isArray(data.comics)) {
                            data.comics.forEach(c => {
                                if (c && typeof c.id === 'string' && typeof c.comicName === 'string') {
                                    let issueGroups = {};
                                    if (c.issueGroups && typeof c.issueGroups === 'object') {
                                        for (const [key, value] of Object.entries(c.issueGroups)) {
                                            issueGroups[key] = String(value);
                                        }
                                    }
                                    state.comics[c.id] = {
                                        id: c.id,
                                        comicName: c.comicName || '',
                                        volume: typeof c.volume === 'string' ? c.volume : '',
                                        year: typeof c.year === 'string' ? c.year : '',
                                        team: typeof c.team === 'string' ? c.team : '',
                                        startIssue: (typeof c.startIssue === 'number' && Number.isFinite(c
                                            .startIssue)) ? c.startIssue : 1,
                                        totalIssues: (typeof c.totalIssues === 'number' && Number.isFinite(c
                                                .totalIssues) && c.totalIssues >= 1) ? Math.min(c.totalIssues,
                                            3000) : 50,
                                        annuals: (Array.isArray(c.annuals)) ? [...c.annuals].filter(n =>
                                            Number.isFinite(n) && n > 0).sort((a, b) => a - b) : [],
                                        specials: (Array.isArray(c.specials)) ? [...c.specials].filter(n =>
                                            Number.isFinite(n) && n > 0).sort((a, b) => a - b) : [],
                                        issueGroups: issueGroups
                                    };
                                    state.order.push(c.id);
                                }
                            });
                        }
                        if (data.activeComicId && state.comics[data.activeComicId]) {
                            state.activeComicId = data.activeComicId;
                        } else if (state.order.length > 0) {
                            state.activeComicId = state.order[0];
                        } else {
                            state.activeComicId = null;
                        }
                        return;
                    }
                    const rawV4 = localStorage.getItem(OLD_STORAGE_KEY_V4);
                    if (rawV4) {
                        const data = JSON.parse(rawV4);
                        state.comics = {};
                        state.order = [];
                        if (Array.isArray(data.comics)) {
                            data.comics.forEach(c => {
                                if (c && typeof c.id === 'string' && typeof c.comicName === 'string') {
                                    let issueGroups = {};
                                    if (c.issueGroups && typeof c.issueGroups === 'object') {
                                        for (const [key, value] of Object.entries(c.issueGroups)) {
                                            issueGroups[key] = String(value);
                                        }
                                    }
                                    state.comics[c.id] = {
                                        id: c.id,
                                        comicName: c.comicName || '',
                                        volume: typeof c.volume === 'string' ? c.volume : '',
                                        year: typeof c.year === 'string' ? c.year : '',
                                        team: typeof c.team === 'string' ? c.team : '',
                                        startIssue: (typeof c.startIssue === 'number' && Number.isFinite(c
                                            .startIssue)) ? c.startIssue : 1,
                                        totalIssues: (typeof c.totalIssues === 'number' && Number.isFinite(c
                                                .totalIssues) && c.totalIssues >= 1) ? Math.min(c.totalIssues,
                                            3000) : 50,
                                        annuals: [],
                                        specials: [],
                                        issueGroups: issueGroups
                                    };
                                    state.order.push(c.id);
                                }
                            });
                        }
                        if (data.activeComicId && state.comics[data.activeComicId]) {
                            state.activeComicId = data.activeComicId;
                        } else if (state.order.length > 0) {
                            state.activeComicId = state.order[0];
                        } else {
                            state.activeComicId = null;
                        }
                        localStorage.removeItem(OLD_STORAGE_KEY_V4);
                        saveState();
                        showToast('已自动迁移 v4 版本数据（年刊/特刊功能已就绪）');
                        return;
                    }
                    const rawV3 = localStorage.getItem(OLD_STORAGE_KEY_V3);
                    if (rawV3) {
                        const data = JSON.parse(rawV3);
                        state.comics = {};
                        state.order = [];
                        if (Array.isArray(data.comics)) {
                            data.comics.forEach(c => {
                                if (c && typeof c.id === 'string' && typeof c.comicName === 'string') {
                                    let issueGroups = {};
                                    if (c.issueGroups && typeof c.issueGroups === 'object') {
                                        for (const [key, value] of Object.entries(c.issueGroups)) {
                                            const trimmed = String(value).trim();
                                            if (trimmed !== '') issueGroups[key] = trimmed;
                                        }
                                    } else if (Array.isArray(c.chineseAvailable)) {
                                        c.chineseAvailable.forEach(n => {
                                            if (typeof n === 'number' && Number.isFinite(n) && Number.isInteger(
                                                    n)) {
                                                issueGroups[String(n)] = '旧数据';
                                            }
                                        });
                                    }
                                    state.comics[c.id] = {
                                        id: c.id,
                                        comicName: c.comicName || '',
                                        volume: typeof c.volume === 'string' ? c.volume : '',
                                        year: typeof c.year === 'string' ? c.year : '',
                                        team: typeof c.team === 'string' ? c.team : '',
                                        startIssue: (typeof c.startIssue === 'number' && Number.isFinite(c
                                            .startIssue)) ? c.startIssue : 1,
                                        totalIssues: (typeof c.totalIssues === 'number' && Number.isFinite(c
                                                .totalIssues) && c.totalIssues >= 1) ? Math.min(c.totalIssues,
                                            3000) : 50,
                                        annuals: [],
                                        specials: [],
                                        issueGroups: issueGroups
                                    };
                                    state.order.push(c.id);
                                }
                            });
                        }
                        if (data.activeComicId && state.comics[data.activeComicId]) {
                            state.activeComicId = data.activeComicId;
                        } else if (state.order.length > 0) {
                            state.activeComicId = state.order[0];
                        } else {
                            state.activeComicId = null;
                        }
                        localStorage.removeItem(OLD_STORAGE_KEY_V3);
                        saveState();
                        showToast('已自动迁移 v3 版本数据');
                        return;
                    }
                    const rawV2 = localStorage.getItem(OLD_STORAGE_KEY_V2);
                    const rawV1 = localStorage.getItem(OLD_STORAGE_KEY_V1);
                    const olderRaw = rawV2 || rawV1;
                    if (olderRaw) {
                        const data = JSON.parse(olderRaw);
                        let comicsToMigrate = [];
                        if (Array.isArray(data.comics)) {
                            comicsToMigrate = data.comics;
                        } else if (typeof data.comicName === 'string' || typeof data.totalIssues === 'number') {
                            comicsToMigrate = [data];
                        }
                        state.comics = {};
                        state.order = [];
                        comicsToMigrate.forEach(c => {
                            if (c && typeof c.comicName === 'string') {
                                let issueGroups = {};
                                if (c.issueGroups && typeof c.issueGroups === 'object') {
                                    for (const [key, value] of Object.entries(c.issueGroups)) {
                                        const trimmed = String(value).trim();
                                        if (trimmed !== '') issueGroups[key] = trimmed;
                                    }
                                } else if (Array.isArray(c.chineseAvailable)) {
                                    c.chineseAvailable.forEach(n => {
                                        if (typeof n === 'number' && Number.isFinite(n) && Number.isInteger(
                                                n)) {
                                            issueGroups[String(n)] = '旧数据';
                                        }
                                    });
                                }
                                state.comics[c.id || generateId()] = {
                                    id: c.id || generateId(),
                                    comicName: c.comicName || '',
                                    volume: typeof c.volume === 'string' ? c.volume : '',
                                    year: typeof c.year === 'string' ? c.year : '',
                                    team: typeof c.team === 'string' ? c.team : '',
                                    startIssue: (typeof c.startIssue === 'number' && Number.isFinite(c
                                        .startIssue)) ? c.startIssue : 1,
                                    totalIssues: (typeof c.totalIssues === 'number' && Number.isFinite(c
                                            .totalIssues) && c.totalIssues >= 1) ? Math.min(c.totalIssues,
                                        3000) : 50,
                                    annuals: [],
                                    specials: [],
                                    issueGroups: issueGroups
                                };
                                state.order.push(c.id || generateId());
                            }
                        });
                        if (state.order.length > 0) state.activeComicId = state.order[0];
                        localStorage.removeItem(OLD_STORAGE_KEY_V2);
                        localStorage.removeItem(OLD_STORAGE_KEY_V1);
                        saveState();
                        showToast('已自动迁移旧版本数据');
                        return;
                    }
                } catch (e) {}
                state.comics = {};
                state.order = [];
                state.activeComicId = null;
            }

            // ──────────────────────────────────────
            // 作品选择器
            // ──────────────────────────────────────
            function rebuildSelector() {
                comicSelector.innerHTML = '';
                if (state.order.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.disabled = true;
                    opt.textContent = '— 请创建作品 —';
                    comicSelector.appendChild(opt);
                    comicSelector.value = '';
                    btnDeleteComic.disabled = true;
                } else {
                    state.order.forEach(id => {
                        const c = state.comics[id];
                        if (!c) return;
                        const opt = document.createElement('option');
                        opt.value = id;
                        let displayName = c.comicName || '未命名作品';
                        if (c.volume && c.volume.trim()) {
                            displayName += ' (' + c.volume.trim() + ')';
                        }
                        opt.textContent = displayName;
                        comicSelector.appendChild(opt);
                    });
                    if (state.activeComicId && state.comics[state.activeComicId]) {
                        comicSelector.value = state.activeComicId;
                    } else {
                        state.activeComicId = state.order[0];
                        comicSelector.value = state.activeComicId;
                    }
                    btnDeleteComic.disabled = false;
                }
            }

            function syncSettingsToPanel() {
                const comic = getActiveComic();
                if (comic) {
                    comicNameInput.value = comic.comicName || '';
                    volumeInput.value = comic.volume || '';
                    yearInput.value = comic.year || '';
                    startIssueInput.value = comic.startIssue;
                    totalIssuesInput.value = comic.totalIssues;
                    annualsInput.value = formatIssueList(comic.annuals || []);
                    specialsInput.value = formatIssueList(comic.specials || []);
                } else {
                    comicNameInput.value = '';
                    volumeInput.value = '';
                    yearInput.value = '';
                    startIssueInput.value = '1';
                    totalIssuesInput.value = '50';
                    annualsInput.value = '';
                    specialsInput.value = '';
                }
                annualGenStart.value = '1';
                annualGenCount.value = '1';
                specialGenStart.value = '1';
                specialGenCount.value = '1';
            }

            function switchToComic(comicId) {
                if (!comicId || !state.comics[comicId]) return;
                state.activeComicId = comicId;
                syncSettingsToPanel();
                currentFilter = 'all';
                filterBtns.forEach(b => b.classList.remove('active'));
                const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                if (allBtn) allBtn.classList.add('active');
                groupFilterSelect.value = '__all__';
                groupFilterSelect.classList.remove('has-selection');
                exitMultiSelectMode(false);
                renderGrid();
                updateStats();
                saveState();
                gridContainer.scrollTop = 0;
                rebuildSelector();
            }

            // ──────────────────────────────────────
            // 计算期号范围
            // ──────────────────────────────────────
            function getMainIssueNumbers() {
                const comic = getActiveComic();
                if (!comic) return [];
                const issues = [];
                for (let i = 0; i < comic.totalIssues; i++) {
                    issues.push(comic.startIssue + i);
                }
                return issues;
            }

            // ──────────────────────────────────────
            // 收集所有汉化组名称
            // ──────────────────────────────────────
            function collectGroupNames() {
                const comic = getActiveComic();
                if (!comic) return [];
                const groups = getActiveIssueGroups();
                const names = new Set();
                const allKeys = getAllIssueKeys();
                for (const key of allKeys) {
                    if (groups.hasOwnProperty(key)) {
                        const trimmed = String(groups[key]).trim();
                        if (trimmed !== '') {
                            names.add(trimmed);
                        }
                    }
                }
                return Array.from(names).sort();
            }

            function updateGroupFilterSelect() {
                const groupNames = collectGroupNames();
                const currentValue = groupFilterSelect.value;
                groupFilterSelect.innerHTML = '<option value="__all__">全部汉化组</option>';
                groupNames.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    groupFilterSelect.appendChild(opt);
                });
                if (currentValue && (currentValue === '__all__' || groupNames.includes(currentValue))) {
                    groupFilterSelect.value = currentValue;
                } else {
                    groupFilterSelect.value = '__all__';
                }
                if (groupFilterSelect.value !== '__all__') {
                    groupFilterSelect.classList.add('has-selection');
                } else {
                    groupFilterSelect.classList.remove('has-selection');
                }
            }

            // ──────────────────────────────────────
            // Modal 弹窗逻辑
            // ──────────────────────────────────────
            function openModal(context) {
                modalContext = context;
                const groupNames = collectGroupNames();

                // 更新datalist
                modalGroupDatalist.innerHTML = '';
                groupNames.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    modalGroupDatalist.appendChild(opt);
                });
                modalGroupInput.setAttribute('list', 'modalGroupDatalist');

                // 更新已有汉化组标签
                modalExistingGroups.innerHTML = '';
                if (groupNames.length > 0) {
                    groupNames.forEach(name => {
                        const tag = document.createElement('span');
                        tag.className = 'modal-group-tag';
                        tag.textContent = name;
                        tag.setAttribute('tabindex', '0');
                        tag.setAttribute('role', 'button');
                        tag.title = '点击选择：' + name;
                        tag.addEventListener('click', () => {
                            modalGroupInput.value = name;
                            modalGroupInput.focus();
                            modalGroupInput.select();
                        });
                        tag.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                modalGroupInput.value = name;
                                modalGroupInput.focus();
                                modalGroupInput.select();
                            }
                        });
                        modalExistingGroups.appendChild(tag);
                    });
                } else {
                    const span = document.createElement('span');
                    span.className = 'modal-no-groups';
                    span.textContent = '暂无已有汉化组';
                    modalExistingGroups.appendChild(span);
                }

                // 设置标题和预填值
                if (context.mode === 'single') {
                    const issueKey = context.issueKey;
                    const displayName = getIssueDisplayName(issueKey);
                    const currentGroup = getIssueGroupNameByKey(issueKey);
                    modalTitleText.textContent = '编辑标记';
                    modalIssueBadge.style.display = '';
                    modalIssueBadge.textContent = displayName;
                    modalGroupInput.value = currentGroup !== null ? currentGroup : '';
                    btnModalClear.style.display = '';
                    if (currentGroup === null) {
                        btnModalClear.disabled = true;
                        btnModalClear.title = '当前未标记，无需清除';
                    } else {
                        btnModalClear.disabled = false;
                        btnModalClear.title = '清除该期数的汉化记录';
                    }
                } else if (context.mode === 'multi') {
                    modalTitleText.textContent = '批量标记汉化组';
                    modalIssueBadge.style.display = '';
                    modalIssueBadge.textContent = '已选 ' + selectedIssueSet.size + ' 期';
                    modalGroupInput.value = '';
                    btnModalClear.style.display = 'none';
                }

                // 显示modal
                groupModalOverlay.classList.add('active');
                document.body.classList.add('modal-open');
                // 聚焦输入框
                setTimeout(() => {
                    modalGroupInput.focus();
                    modalGroupInput.select();
                }, 150);
            }

            function closeModal() {
                groupModalOverlay.classList.remove('active');
                document.body.classList.remove('modal-open');
                modalContext = null;
                modalGroupInput.value = '';
                modalGroupInput.removeAttribute('list');
                modalGroupDatalist.innerHTML = '';
                modalExistingGroups.innerHTML = '';
            }

            function confirmModal() {
                if (!modalContext) return;
                const trimmed = modalGroupInput.value.trim();

                if (modalContext.mode === 'single') {
                    const issueKey = modalContext.issueKey;
                    const cellElement = modalContext.cellElement;
                    if (!isValidIssueKey(issueKey)) {
                        closeModal();
                        return;
                    }
                    const currentGroup = getIssueGroupNameByKey(issueKey);
                    setIssueGroupByKey(issueKey, trimmed);
                    const newGroupName = getIssueGroupNameByKey(issueKey);
                    if (cellElement) {
                        updateSingleCell(cellElement, issueKey, newGroupName);
                    }
                    updateStats();
                    updateGroupFilterSelect();
                    applyFilterToCells();
                    saveState();
                    const displayName = getIssueDisplayName(issueKey);
                    if (currentGroup === null && trimmed === '') {
                        showToast(`${displayName} → 已汉化（未指定组名）`);
                    } else if (currentGroup === null) {
                        showToast(`${displayName} → 已汉化（${trimmed}）`);
                    } else if (currentGroup !== trimmed) {
                        const label = trimmed !== '' ? '（' + trimmed + '）' : '（未指定组名）';
                        showToast(`${displayName} → 已更新 ${label}`);
                    }
                    closeModal();
                } else if (modalContext.mode === 'multi') {
                    if (selectedIssueSet.size === 0) {
                        showToast('请先选择期数');
                        closeModal();
                        return;
                    }
                    let count = 0;
                    selectedIssueSet.forEach(issueKey => {
                        if (isValidIssueKey(issueKey)) {
                            setIssueGroupByKey(issueKey, trimmed);
                            count++;
                        }
                    });
                    refreshSelectedCells();
                    updateStats();
                    updateGroupFilterSelect();
                    applyFilterToCells();
                    saveState();
                    const label = trimmed !== '' ? '（' + trimmed + '）' : '（未指定组名）';
                    showToast(`已标记 ${count} 期 ${label}`);
                    updateSelectedCount();
                    closeModal();
                }
            }

            function clearModalIssue() {
                if (!modalContext || modalContext.mode !== 'single') return;
                const issueKey = modalContext.issueKey;
                const cellElement = modalContext.cellElement;
                if (!isValidIssueKey(issueKey)) {
                    closeModal();
                    return;
                }
                const currentGroup = getIssueGroupNameByKey(issueKey);
                if (currentGroup === null) {
                    closeModal();
                    return;
                }
                removeIssueGroupByKey(issueKey);
                if (cellElement) {
                    updateSingleCell(cellElement, issueKey, null);
                }
                updateStats();
                updateGroupFilterSelect();
                applyFilterToCells();
                saveState();
                const displayName = getIssueDisplayName(issueKey);
                showToast(`已清除 ${displayName} 的汉化记录`);
                closeModal();
            }

            // ──────────────────────────────────────
            // 多选模式
            // ──────────────────────────────────────
            function enterMultiSelectMode() {
                if (multiSelectMode) return;
                multiSelectMode = true;
                selectedIssueSet.clear();
                btnMultiSelectToggle.classList.add('active');
                multiSelectBar.classList.add('visible');
                updateSelectedCount();
                applyMultiSelectVisuals();
            }

            function exitMultiSelectMode(updateUI = true) {
                if (!multiSelectMode) return;
                multiSelectMode = false;
                selectedIssueSet.clear();
                btnMultiSelectToggle.classList.remove('active');
                multiSelectBar.classList.remove('visible');
                if (updateUI) {
                    clearAllMultiSelectVisuals();
                }
            }

            function toggleMultiSelectMode() {
                if (multiSelectMode) {
                    exitMultiSelectMode();
                    showToast('已退出多选模式');
                } else {
                    enterMultiSelectMode();
                    showToast('已进入多选模式，点击期数进行多选（长按也可进入）');
                }
            }

            function toggleIssueSelectionByKey(issueKey, cellElement) {
                if (!multiSelectMode) return;
                if (selectedIssueSet.has(issueKey)) {
                    selectedIssueSet.delete(issueKey);
                    if (cellElement) cellElement.classList.remove('multi-selected');
                } else {
                    selectedIssueSet.add(issueKey);
                    if (cellElement) cellElement.classList.add('multi-selected');
                }
                updateSelectedCount();
            }

            function updateSelectedCount() {
                selectedCount.textContent = '已选 ' + selectedIssueSet.size + ' 期';
            }

            function selectAllVisibleIssues() {
                if (!multiSelectMode) return;
                const cells = issuesGrid.querySelectorAll('.issue-cell');
                selectedIssueSet.clear();
                cells.forEach(cell => {
                    if (cell.style.display !== 'none') {
                        const issueKey = cell.dataset.issueKey;
                        if (issueKey) {
                            selectedIssueSet.add(issueKey);
                            cell.classList.add('multi-selected');
                        }
                    }
                });
                updateSelectedCount();
                if (selectedIssueSet.size === 0) {
                    showToast('当前没有可见期数可选');
                }
            }

            function applyMultiSelectVisuals() {
                const cells = issuesGrid.querySelectorAll('.issue-cell');
                cells.forEach(cell => {
                    const issueKey = cell.dataset.issueKey;
                    if (issueKey && selectedIssueSet.has(issueKey)) {
                        cell.classList.add('multi-selected');
                    } else {
                        cell.classList.remove('multi-selected');
                    }
                });
            }

            function clearAllMultiSelectVisuals() {
                const cells = issuesGrid.querySelectorAll('.issue-cell');
                cells.forEach(cell => cell.classList.remove('multi-selected'));
            }

            function markSelectedIssues() {
                if (!multiSelectMode || selectedIssueSet.size === 0) {
                    showToast('请先选择期数');
                    return;
                }
                openModal({ mode: 'multi' });
            }

            function unmarkSelectedIssues() {
                if (!multiSelectMode || selectedIssueSet.size === 0) {
                    showToast('请先选择期数');
                    return;
                }
                if (!confirm(`确定要清除选中 ${selectedIssueSet.size} 期的汉化记录吗？`)) return;
                selectedIssueSet.forEach(issueKey => {
                    if (isValidIssueKey(issueKey)) {
                        removeIssueGroupByKey(issueKey);
                    }
                });
                refreshSelectedCells();
                updateStats();
                updateGroupFilterSelect();
                applyFilterToCells();
                saveState();
                showToast(`已清除 ${selectedIssueSet.size} 期的汉化记录`);
                updateSelectedCount();
            }

            function refreshSelectedCells() {
                selectedIssueSet.forEach(issueKey => {
                    const cell = issuesGrid.querySelector(`.issue-cell[data-issue-key="${CSS.escape(issueKey)}"]`);
                    if (cell) {
                        const groupName = getIssueGroupNameByKey(issueKey);
                        updateSingleCell(cell, issueKey, groupName);
                        if (multiSelectMode) cell.classList.add('multi-selected');
                    }
                });
            }

            if (!CSS.escape) {
                CSS.escape = function(value) {
                    return String(value).replace(/([^\w-])/g, '\\$1');
                };
            }

            // ──────────────────────────────────────
            // 渲染网格
            // ──────────────────────────────────────
            function renderGrid() {
                issuesGrid.innerHTML = '';
                const comic = getActiveComic();
                if (!comic) {
                    issuesGrid.style.display = 'none';
                    emptyState.style.display = '';
                    gridGenerated = false;
                    updateStats();
                    updateGroupFilterSelect();
                    return;
                }
                const mainIssues = getMainIssueNumbers();
                const annuals = comic.annuals || [];
                const specials = comic.specials || [];
                const totalCells = mainIssues.length + annuals.length + specials.length;

                if (totalCells === 0) {
                    issuesGrid.style.display = 'none';
                    emptyState.style.display = '';
                    gridGenerated = false;
                    updateStats();
                    updateGroupFilterSelect();
                    return;
                }

                emptyState.style.display = 'none';
                issuesGrid.style.display = '';
                gridGenerated = true;

                const fragment = document.createDocumentFragment();

                mainIssues.forEach(issueNum => {
                    const issueKey = mainIssueKey(issueNum);
                    const cell = createIssueCell(issueKey, issueNum, 'main');
                    fragment.appendChild(cell);
                });

                if (annuals.length > 0) {
                    const annualLabel = document.createElement('div');
                    annualLabel.className = 'section-label annual-label';
                    annualLabel.innerHTML = '<span class="label-dot"></span>年刊 Annuals';
                    // 快速跳转按钮
                    const jumpBtn = document.createElement('button');
                    jumpBtn.className = 'section-jump-btn';
                    jumpBtn.textContent = '跳转↗';
                    jumpBtn.title = '快速跳转到年刊期号';
                    jumpBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        jumpTypeSelect.value = 'annual';
                        jumpInput.focus();
                        jumpInput.select();
                    });
                    annualLabel.appendChild(jumpBtn);
                    fragment.appendChild(annualLabel);

                    annuals.forEach(issueNum => {
                        const issueKey = annualIssueKey(issueNum);
                        const cell = createIssueCell(issueKey, issueNum, 'annual');
                        fragment.appendChild(cell);
                    });
                }

                if (specials.length > 0) {
                    const specialLabel = document.createElement('div');
                    specialLabel.className = 'section-label special-label';
                    specialLabel.innerHTML = '<span class="label-dot"></span>特刊 Specials';
                    const jumpBtn = document.createElement('button');
                    jumpBtn.className = 'section-jump-btn';
                    jumpBtn.textContent = '跳转↗';
                    jumpBtn.title = '快速跳转到特刊期号';
                    jumpBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        jumpTypeSelect.value = 'special';
                        jumpInput.focus();
                        jumpInput.select();
                    });
                    specialLabel.appendChild(jumpBtn);
                    fragment.appendChild(specialLabel);

                    specials.forEach(issueNum => {
                        const issueKey = specialIssueKey(issueNum);
                        const cell = createIssueCell(issueKey, issueNum, 'special');
                        fragment.appendChild(cell);
                    });
                }

                issuesGrid.appendChild(fragment);
                updateStats();
                updateGroupFilterSelect();
            }

            function createIssueCell(issueKey, issueNum, issueType) {
                const cell = document.createElement('div');
                cell.className = 'issue-cell';
                cell.dataset.issueKey = issueKey;
                cell.dataset.issueNum = issueNum;
                cell.dataset.issueType = issueType;
                cell.setAttribute('tabindex', '0');
                cell.setAttribute('role', 'button');

                const groupName = getIssueGroupNameByKey(issueKey);
                const displayName = getIssueDisplayName(issueKey);

                if (issueType === 'annual') {
                    cell.classList.add('annual');
                } else if (issueType === 'special') {
                    cell.classList.add('special');
                }

                if (groupName !== null) {
                    cell.classList.add('marked');
                    if (groupName !== '') {
                        cell.title = `${displayName} — 汉化组：${groupName}`;
                        cell.setAttribute('aria-label', `${displayName}，汉化组：${groupName}`);
                        cell.innerHTML = buildMarkedCellInnerHTML(issueNum, groupName, issueType);
                    } else {
                        cell.title = `${displayName} — 已汉化（未指定汉化组）`;
                        cell.setAttribute('aria-label', `${displayName}，已汉化未指定汉化组`);
                        cell.innerHTML = buildMarkedCellInnerHTML(issueNum, '', issueType);
                    }
                } else {
                    cell.classList.add('unmarked');
                    cell.title = `${displayName} — 未汉化`;
                    cell.setAttribute('aria-label', `${displayName}，未汉化`);
                    cell.innerHTML = buildUnmarkedCellInnerHTML(issueNum, issueType);
                }

                applyCellFilter(cell, issueKey, groupName);

                if (multiSelectMode && selectedIssueSet.has(issueKey)) {
                    cell.classList.add('multi-selected');
                }

                cell.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (multiSelectMode) {
                        toggleIssueSelectionByKey(issueKey, cell);
                    } else {
                        openModal({ mode: 'single', issueKey: issueKey, cellElement: cell });
                    }
                });

                cell.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        if (multiSelectMode) {
                            toggleIssueSelectionByKey(issueKey, cell);
                        } else {
                            openModal({ mode: 'single', issueKey: issueKey, cellElement: cell });
                        }
                    }
                });

                let longPressTimer = null;
                let longPressed = false;
                cell.addEventListener('touchstart', (e) => {
                    longPressed = false;
                    longPressTimer = setTimeout(() => {
                        longPressed = true;
                        if (!multiSelectMode) {
                            enterMultiSelectMode();
                            showToast('已进入多选模式');
                        }
                        toggleIssueSelectionByKey(issueKey, cell);
                    }, 500);
                }, { passive: true });
                cell.addEventListener('touchend', () => {
                    clearTimeout(longPressTimer);
                    if (longPressed) longPressed = false;
                });
                cell.addEventListener('touchmove', () => {
                    clearTimeout(longPressTimer);
                });
                cell.addEventListener('click', function(e) {
                    if (longPressed) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        longPressed = false;
                    }
                }, true);

                return cell;
            }

            function buildMarkedCellInnerHTML(issueNum, groupName, issueType) {
                const typeBadge = getIssueTypeBadgeByType(issueType);
                let html = `
                    <svg class="cell-icon-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <polyline points="4,12.5 9.5,18 20,6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="cell-number">${issueNum}</span>`;
                if (typeBadge) html +=
                    `<span class="cell-type-badge">${escapeHtml(typeBadge)}</span>`;
                if (groupName !== '') {
                    html +=
                        `<span class="cell-group-name" title="${escapeHtml(groupName)}">${escapeHtml(truncateGroupName(groupName))}</span>`;
                } else {
                    html += `<span class="cell-group-name no-name">已汉化</span>`;
                }
                return html;
            }

            function buildUnmarkedCellInnerHTML(issueNum, issueType) {
                const typeBadge = getIssueTypeBadgeByType(issueType);
                let html = `
                    <svg class="cell-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                    <span class="cell-number">${issueNum}</span>`;
                if (typeBadge) html +=
                    `<span class="cell-type-badge">${escapeHtml(typeBadge)}</span>`;
                return html;
            }

            function getIssueTypeBadgeByType(issueType) {
                if (issueType === 'annual') return '年刊';
                if (issueType === 'special') return '特刊';
                return '';
            }

            function applyCellFilter(cell, issueKey, groupName) {
                const selectedGroup = groupFilterSelect.value;
                if (selectedGroup && selectedGroup !== '__all__') {
                    if (groupName !== null && groupName !== '' && groupName === selectedGroup) {
                        cell.style.display = '';
                    } else {
                        cell.style.display = 'none';
                    }
                    return;
                }
                if (currentFilter === 'all') {
                    cell.style.display = '';
                } else if (currentFilter === 'marked') {
                    cell.style.display = (groupName !== null) ? '' : 'none';
                } else if (currentFilter === 'unmarked') {
                    cell.style.display = (groupName === null) ? '' : 'none';
                }
            }

            function applyFilterToCells() {
                const cells = issuesGrid.querySelectorAll('.issue-cell');
                cells.forEach(cell => {
                    const issueKey = cell.dataset.issueKey;
                    const groupName = getIssueGroupNameByKey(issueKey);
                    applyCellFilter(cell, issueKey, groupName);
                });
                if (multiSelectMode) applyMultiSelectVisuals();
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function truncateGroupName(name) {
                if (!name) return '';
                if (name.length <= 6) return name;
                return name.substring(0, 5) + '…';
            }

            function updateSingleCell(cell, issueKey, groupName) {
                const issueNum = parseInt(cell.dataset.issueNum, 10);
                const issueType = cell.dataset.issueType || 'main';
                const displayName = getIssueDisplayName(issueKey);

                cell.classList.remove('unmarked', 'marked');

                if (groupName !== null) {
                    cell.classList.add('marked');
                    if (groupName !== '') {
                        cell.title = `${displayName} — 汉化组：${groupName}`;
                        cell.setAttribute('aria-label', `${displayName}，汉化组：${groupName}`);
                        cell.innerHTML = buildMarkedCellInnerHTML(issueNum, groupName, issueType);
                    } else {
                        cell.title = `${displayName} — 已汉化（未指定汉化组）`;
                        cell.setAttribute('aria-label', `${displayName}，已汉化未指定汉化组`);
                        cell.innerHTML = buildMarkedCellInnerHTML(issueNum, '', issueType);
                    }
                } else {
                    cell.classList.add('unmarked');
                    cell.title = `${displayName} — 未汉化`;
                    cell.setAttribute('aria-label', `${displayName}，未汉化`);
                    cell.innerHTML = buildUnmarkedCellInnerHTML(issueNum, issueType);
                }

                if (issueType === 'annual') cell.classList.add('annual');
                if (issueType === 'special') cell.classList.add('special');

                if (multiSelectMode && selectedIssueSet.has(issueKey)) {
                    cell.classList.add('multi-selected');
                } else {
                    cell.classList.remove('multi-selected');
                }
            }

            // ──────────────────────────────────────
            // 更新统计
            // ──────────────────────────────────────
            function updateStats() {
                const comic = getActiveComic();
                const total = comic ? comic.totalIssues : 0;
                const marked = countMainMarked();
                const unmarked = total - marked;
                const percent = total > 0 ? Math.round((marked / total) * 100) : 0;

                statTotal.textContent = total;
                statMarked.textContent = marked;
                statUnmarked.textContent = unmarked;
                statPercent.textContent = percent + '%';
                progressFill.style.width = percent + '%';

                const annuals = comic ? (comic.annuals || []) : [];
                const annualMarkedCount = countSpecialTypeMarked('annual');
                if (annuals.length > 0) {
                    statAnnuals.style.display = '';
                    statAnnualCount.textContent = annuals.length;
                    statAnnualMarked.textContent = annualMarkedCount;
                } else {
                    statAnnuals.style.display = 'none';
                }

                const specials = comic ? (comic.specials || []) : [];
                const specialMarkedCount = countSpecialTypeMarked('special');
                if (specials.length > 0) {
                    statSpecials.style.display = '';
                    statSpecialCount.textContent = specials.length;
                    statSpecialMarked.textContent = specialMarkedCount;
                } else {
                    statSpecials.style.display = 'none';
                }

                if (total === 0 && annuals.length === 0 && specials.length === 0) {
                    statsBar.style.opacity = '0.4';
                } else {
                    statsBar.style.opacity = '1';
                }

                // 动态调整跳转类型下拉框选项
                updateJumpTypeOptions(annuals.length, specials.length);
            }

            function updateJumpTypeOptions(hasAnnuals, hasSpecials) {
                const currentVal = jumpTypeSelect.value;
                jumpTypeSelect.innerHTML = '<option value="main">主刊</option>';
                if (hasAnnuals) {
                    const opt = document.createElement('option');
                    opt.value = 'annual';
                    opt.textContent = '年刊';
                    jumpTypeSelect.appendChild(opt);
                }
                if (hasSpecials) {
                    const opt = document.createElement('option');
                    opt.value = 'special';
                    opt.textContent = '特刊';
                    jumpTypeSelect.appendChild(opt);
                }
                // 恢复选择（如果之前的选择仍然存在）
                const availableValues = Array.from(jumpTypeSelect.options).map(o => o.value);
                if (availableValues.includes(currentVal)) {
                    jumpTypeSelect.value = currentVal;
                } else {
                    jumpTypeSelect.value = 'main';
                }
            }

            function countMainMarked() {
                const comic = getActiveComic();
                if (!comic) return 0;
                const groups = getActiveIssueGroups();
                const minIssue = comic.startIssue;
                const maxIssue = comic.startIssue + comic.totalIssues - 1;
                let count = 0;
                for (const key of Object.keys(groups)) {
                    const num = parseInt(key, 10);
                    if (Number.isFinite(num) && num >= minIssue && num <= maxIssue) count++;
                }
                return count;
            }

            function countSpecialTypeMarked(type) {
                const comic = getActiveComic();
                if (!comic) return 0;
                const groups = getActiveIssueGroups();
                const prefix = type === 'annual' ? 'annual_' : 'special_';
                let count = 0;
                for (const key of Object.keys(groups)) {
                    if (typeof key === 'string' && key.startsWith(prefix)) count++;
                }
                return count;
            }

            // ──────────────────────────────────────
            // 清理无效标记
            // ──────────────────────────────────────
            function cleanInvalidMarks() {
                const comic = getActiveComic();
                if (!comic) return 0;
                const groups = getActiveIssueGroups();
                const validKeys = new Set(getAllIssueKeys());
                let removed = 0;
                for (const key of Object.keys(groups)) {
                    if (!validKeys.has(key)) {
                        delete groups[key];
                        removed++;
                    }
                }
                return removed;
            }

            // ──────────────────────────────────────
            // 生成/刷新网格
            // ──────────────────────────────────────
            function generateGrid() {
                const comicName = comicNameInput.value.trim();
                const volume = volumeInput.value.trim();
                const year = yearInput.value.trim();
                const startIssue = parseInt(startIssueInput.value, 10);
                const totalIssues = parseInt(totalIssuesInput.value, 10);
                const annuals = parseIssueList(annualsInput.value);
                const specials = parseIssueList(specialsInput.value);

                if (!Number.isFinite(startIssue)) { showToast('请输入有效的起始期号'); return; }
                if (!Number.isFinite(totalIssues) || totalIssues < 1) { showToast('总期数必须大于0'); return; }
                if (totalIssues > 3000) { showToast('总期数不能超过3000'); return; }

                let comic = getActiveComic();

                if (!comic) {
                    if (!comicName) { showToast('请至少输入刊物名以创建作品'); return; }
                    const newComic = createDefaultComic(comicName);
                    newComic.volume = volume;
                    newComic.year = year;
                    newComic.startIssue = startIssue;
                    newComic.totalIssues = totalIssues;
                    newComic.annuals = annuals;
                    newComic.specials = specials;
                    state.comics[newComic.id] = newComic;
                    state.order.push(newComic.id);
                    state.activeComicId = newComic.id;
                    comic = newComic;
                    rebuildSelector();
                    showToast(`已创建作品"${comicName || '未命名作品'}"`);
                } else {
                    comic.comicName = comicName;
                    comic.volume = volume;
                    comic.year = year;
                    comic.startIssue = startIssue;
                    comic.totalIssues = totalIssues;
                    comic.annuals = annuals;
                    comic.specials = specials;
                }

                const removed = cleanInvalidMarks();
                if (removed > 0) showToast(`已自动清理 ${removed} 个超出范围的标记`);

                currentFilter = 'all';
                filterBtns.forEach(b => b.classList.remove('active'));
                const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                if (allBtn) allBtn.classList.add('active');
                groupFilterSelect.value = '__all__';
                groupFilterSelect.classList.remove('has-selection');

                exitMultiSelectMode(false);
                renderGrid();
                saveState();
                updateStats();
                rebuildSelector();

                const totalCells = totalIssues + annuals.length + specials.length;
                let msg = `已生成 ${totalIssues} 期主刊网格（#${startIssue} - #${startIssue + totalIssues - 1}）`;
                if (annuals.length > 0) msg += ` + ${annuals.length} 期年刊`;
                if (specials.length > 0) msg += ` + ${specials.length} 期特刊`;
                showToast(msg);

                gridContainer.scrollTop = 0;
            }

            // ──────────────────────────────────────
            // 作品CRUD操作
            // ──────────────────────────────────────
            function addNewComic() {
                const name = prompt('请输入新作品的刊物名：', '');
                if (name === null) return;
                const trimmedName = name.trim();
                const newComic = createDefaultComic(trimmedName || '未命名作品');
                state.comics[newComic.id] = newComic;
                state.order.push(newComic.id);
                state.activeComicId = newComic.id;
                syncSettingsToPanel();
                currentFilter = 'all';
                filterBtns.forEach(b => b.classList.remove('active'));
                const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                if (allBtn) allBtn.classList.add('active');
                groupFilterSelect.value = '__all__';
                groupFilterSelect.classList.remove('has-selection');
                exitMultiSelectMode(false);
                renderGrid();
                updateStats();
                saveState();
                rebuildSelector();
                gridContainer.scrollTop = 0;
                showToast(`已创建作品"${newComic.comicName || '未命名作品'}"`);
            }

            function deleteCurrentComic() {
                const comic = getActiveComic();
                if (!comic) { showToast('没有可删除的作品'); return; }
                const displayName = comic.comicName || '未命名作品';
                const confirmMsg =
                    `确定要删除作品"${displayName}"吗？\n\n该操作将删除此作品的所有汉化记录（含年刊特刊），且不可撤销。`;
                if (!confirm(confirmMsg)) return;

                const deletingId = state.activeComicId;
                delete state.comics[deletingId];
                state.order = state.order.filter(id => id !== deletingId);

                if (state.order.length > 0) {
                    state.activeComicId = state.order[0];
                } else {
                    state.activeComicId = null;
                }

                syncSettingsToPanel();
                currentFilter = 'all';
                filterBtns.forEach(b => b.classList.remove('active'));
                const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                if (allBtn) allBtn.classList.add('active');
                groupFilterSelect.value = '__all__';
                groupFilterSelect.classList.remove('has-selection');
                exitMultiSelectMode(false);
                renderGrid();
                updateStats();
                saveState();
                rebuildSelector();
                gridContainer.scrollTop = 0;
                showToast(`已删除作品"${displayName}"`);
            }

            // ──────────────────────────────────────
            // 批量操作（含年刊特刊）
            // ──────────────────────────────────────
            function markAll() {
                if (!gridGenerated) return;
                const comic = getActiveComic();
                if (!comic) return;
                const allGroups = collectGroupNames();
                let hintText = '';
                if (allGroups.length > 0) hintText = '\n\n已有汉化组：' + allGroups.join('、');
                const groupName = prompt('请输入用于全部期数（含年刊特刊）的汉化组名称（可选，留空则仅标记为已汉化）：' + hintText,
                    '');
                if (groupName === null) return;
                const trimmed = groupName.trim();
                const allKeys = getAllIssueKeys();
                if (!comic.issueGroups || typeof comic.issueGroups !== 'object') comic.issueGroups = {};
                allKeys.forEach(key => { comic.issueGroups[key] = trimmed; });
                exitMultiSelectMode(false);
                renderGrid();
                saveState();
                updateStats();
                updateGroupFilterSelect();
                const label = trimmed !== '' ? '（' + trimmed + '）' : '（未指定组名）';
                showToast(`已标记全部 ${allKeys.length} 期为已汉化 ${label}`);
            }

            function unmarkAll() {
                if (!gridGenerated) return;
                const comic = getActiveComic();
                if (!comic) return;
                const allKeys = getAllIssueKeys();
                const groups = getActiveIssueGroups();
                let count = 0;
                allKeys.forEach(key => { if (groups.hasOwnProperty(key)) count++; });
                if (count === 0) { showToast('当前没有已汉化的期数'); return; }
                if (!confirm(`确定要清除全部 ${count} 期的汉化记录吗？（含年刊特刊）`)) return;
                comic.issueGroups = {};
                exitMultiSelectMode(false);
                renderGrid();
                saveState();
                updateStats();
                updateGroupFilterSelect();
                showToast('已取消全部汉化记录');
            }

            function invertMarks() {
                if (!gridGenerated) return;
                const comic = getActiveComic();
                if (!comic) return;
                const allGroups = collectGroupNames();
                let hintText = '';
                if (allGroups.length > 0) hintText = '\n\n已有汉化组：' + allGroups.join('、');
                const groupName = prompt('请输入用于新标记期数的汉化组名称（可选，留空则仅标记为已汉化）：' + hintText, '');
                if (groupName === null) return;
                const trimmed = groupName.trim();
                const allKeys = getAllIssueKeys();
                if (!comic.issueGroups || typeof comic.issueGroups !== 'object') comic.issueGroups = {};
                allKeys.forEach(key => {
                    if (comic.issueGroups.hasOwnProperty(key)) {
                        delete comic.issueGroups[key];
                    } else {
                        comic.issueGroups[key] = trimmed;
                    }
                });
                exitMultiSelectMode(false);
                renderGrid();
                saveState();
                updateStats();
                updateGroupFilterSelect();
                const marked = countMainMarked() + countSpecialTypeMarked('annual') + countSpecialTypeMarked('special');
                showToast(`已反选，当前已汉化：${marked} 期`);
            }

            // ──────────────────────────────────────
            // JSON导出（全部作品）
            // ──────────────────────────────────────
            function exportJSON(filename) {
                const comicsArray = state.order.map(id => {
                    const c = state.comics[id];
                    if (!c) return null;
                    const cleanIssueGroups = {};
                    if (c.issueGroups && typeof c.issueGroups === 'object') {
                        const sortedKeys = Object.keys(c.issueGroups).sort((a, b) => {
                            const na = parseInt(a, 10);
                            const nb = parseInt(b, 10);
                            if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
                            return a.localeCompare(b);
                        });
                        sortedKeys.forEach(key => { cleanIssueGroups[key] = String(c.issueGroups[key]); });
                    }
                    return {
                        id: c.id,
                        comicName: c.comicName || '未命名作品',
                        volume: c.volume || '',
                        year: c.year || '',
                        team: c.team || '',
                        startIssue: c.startIssue,
                        totalIssues: c.totalIssues,
                        annuals: (c.annuals && Array.isArray(c.annuals)) ? [...c.annuals].sort((a, b) => a - b) : [],
                        specials: (c.specials && Array.isArray(c.specials)) ? [...c.specials].sort((a, b) => a - b) :
                            [],
                        issueGroups: cleanIssueGroups
                    };
                }).filter(Boolean);
                const data = { version: 'multi-v5', exportDate: new Date().toISOString(), comics: comicsArray };
                const jsonStr = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function exportCurrentData() {
                if (state.order.length === 0) { showToast('暂无数据可导出，请先创建作品'); return; }
                const totalComics = state.order.length;
                exportJSON(`美漫汉化记录_${totalComics}部作品.json`);
                showToast(`导出成功！共 ${totalComics} 部作品`);
            }
